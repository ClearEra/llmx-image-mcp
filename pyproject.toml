[project]
name = "llmx-image-mcp"
version = "0.1.0"
description = "LLMX Image MCP Server - 让 AI 客户端直接调用 LLMX 图像生成能力"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
llmx-image-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
